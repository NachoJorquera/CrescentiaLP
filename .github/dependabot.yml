version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # @astrojs/check 0.9.12 accepts TypeScript ^5 || ^6 only; drop this once it accepts TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
